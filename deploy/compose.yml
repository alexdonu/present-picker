# Production stack on the Kamatera server, in /opt/present-picker (uploaded by the deploy workflow).
#
# The image is not pulled from a registry: CI builds it, streams it over SSH (`docker load`) and tags it
# present-picker:latest. Secrets live in /opt/present-picker/.env, created once by deploy/bootstrap.sh.
name: present-picker

services:
  app:
    image: present-picker:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      # The party database, the images inside it and the MIC2 webhook db. This folder IS the backup.
      - ./data:/app/data
    # Not published on the host: only Caddy reaches it, over the compose network.
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The TLS certificates; losing them only means Caddy asks Let's Encrypt again.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
